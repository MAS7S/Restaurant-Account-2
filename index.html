<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant Accounts</title>
<meta name="theme-color" content="#0b6145">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/app-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/app-180.png">
<script defer src="./register-pwa.js"></script>
<style>
:root{--bg:#eef4f7;--card:#fff;--tx:#1c2b33;--bd:#cfd9df;--g:#2f9e44;--r:#d6336c;--b:#0f8b8d;--inp:#fff;--row:#f6f9fb;--mut:#6b7c86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161b2e;--card:#232a45;--tx:#eef1fa;--bd:#3a4468;--inp:#111729;--row:#1f2740;--mut:#8f9ab8}}
:root[data-theme="dark"]{--bg:#161b2e;--card:#232a45;--tx:#eef1fa;--bd:#3a4468;--inp:#111729;--row:#1f2740;--mut:#8f9ab8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif}
.ban{background:linear-gradient(135deg,#0f8b8d,#2f6fdb);color:#fff;border-radius:0 0 22px 22px;padding:18px;text-align:center}
.bn{font-size:22px;font-weight:bold}.bt{font-size:13px;margin-top:6px;opacity:.95}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{display:block;font-size:12px;font-weight:bold;margin:8px 0 3px}
label:first-child{margin-top:0}
input,select{background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;font:inherit;font-size:16px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#8f9ab8 50%),linear-gradient(135deg,#8f9ab8 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
h3{margin:0 0 8px;font-size:15px}
.dr{background:var(--row);border:1px solid var(--bd);border-radius:16px;padding:10px;margin-bottom:10px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dh b{font-size:17px}.dh span{color:var(--mut);font-size:13px;margin-left:6px}
.dt{font-weight:bold;font-size:17px;direction:ltr}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g3 label{font-size:12px;letter-spacing:.04em;margin:0 0 3px}
.lc{color:#6f9cf0}.lk{color:#4fb96b}.le{color:#e8736f}
.g3 input,.eb{height:46px}
.eb{width:100%;border:1.5px dashed #e8736f;background:transparent;color:#e8736f;border-radius:12px;font:bold 15px Arial;padding:0 4px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--bd)}
.row .a{flex:0 0 110px}.row .n{flex:1 1 120px}.row .c{flex:1 1 100%}.row .t{flex:0 0 92px}
.x{flex:0 0 42px;border:1px solid var(--r);background:transparent;color:var(--r);border-radius:10px;font:bold 18px Arial;cursor:pointer}
.add{width:100%;border:0;border-radius:12px;padding:12px;font:bold 14px Arial;color:#fff;cursor:pointer;background:var(--r)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b{border:0;border-radius:12px;padding:14px 6px;font:bold 14px Arial;color:#fff;cursor:pointer;background:#2f6fdb}
.b.s{background:#f2c14e;grid-column:1/-1}
.sc{border-radius:20px;padding:16px;margin:0 0 12px;border:1px solid #3a4468}
.sc .l{font-size:13px;font-weight:bold;letter-spacing:.06em}
.sc .v{font-size:32px;font-weight:bold;margin:2px 0 12px;direction:ltr;text-align:left}
.sc .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc .two div{border-radius:14px;padding:10px 12px}
.sc .two span{display:block;font-size:12px;font-weight:bold;letter-spacing:.05em}
.sc .two b{display:block;font-size:19px;margin-top:2px;direction:ltr;text-align:left}
.sc.net{background:#0d1117;color:#fff}.sc.net .two div{background:#252830}.sc.net .two span{color:#c9ced8}
.sc.ex{background:#381819;color:#e8736f}.sc.ex .two div{background:#4a2022}
.sc.in{background:#18274a;color:#86aef8}.sc.in .two div{background:#1c2b5a}
.md{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.md[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.mh h3{margin:0;color:#e8736f;font-size:16px}
.mh button{border:0;border-radius:10px;background:#2f6fdb;color:#fff;font:bold 14px Arial;padding:10px 16px;cursor:pointer}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mc div{background:#381819;color:#e8736f;border-radius:12px;padding:10px;font-size:12px;font-weight:bold}
.mc b{display:block;font-size:17px;margin-top:2px;direction:ltr}
#pv{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:0 10px env(safe-area-inset-bottom,0px)}
#pv img{width:100%;display:block;margin:0 0 10px;border-radius:8px;background:#fff}
.pvh{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;font-size:13px;position:sticky;top:0;background:var(--bg)}
.pvh button{flex:none;border:0;border-radius:10px;background:#2f6fdb;color:#fff;font:bold 14px Arial;padding:10px 14px}
</style>
<link rel="stylesheet" href="./access.css">
</head>
<body>
<details class="install-app access-ui" id="install-app" hidden>
  <summary><img src="./icons/app-192.png" width="24" height="24" alt=""> <span></span></summary>
  <p></p>
  <button type="button" class="primary" hidden></button>
</details>
<section class="access-ui sign-in" id="sign-in"></section>
<section class="access-ui access-bar" id="access-bar" hidden></section>
<dialog class="access-ui dialog" id="access-dialog"></dialog>
<div id="accounts-app" hidden>
<header class="ban"><div class="bn" id="bn">Restaurant Accounts</div><div class="bt" id="bt"></div></header>
<main>
<section class="card">
<label for="nm">Restaurant name</label><input id="nm" placeholder="Restaurant name">
<label for="wk">Week starts</label><input id="wk" type="date">
<label for="cu">Currency</label><input id="cu" placeholder="$">
</section>
<div id="days"></div>
<section class="card"><h3>Week total</h3><div id="wsum"></div></section>
<div class="btns"><button class="b" id="sh" type="button">Share PDF</button><button class="b" id="pdf" type="button" style="background:#0f8b8d">Save PDF</button><button class="b s" id="nx" type="button">Next week</button></div>
</main>
<div class="md" id="md" hidden><div class="sheet"><div class="mh"><h3 id="mt"></h3><button id="mx" type="button">Done</button></div><div id="ml"></div><button class="add" id="ma" type="button">+ Add expense</button><div class="mc"><div>CASH EXPENSES<b id="mc"></b></div><div>CREDIT EXPENSES<b id="mk"></b></div></div></div></div>
</div>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=String(s||'').split('-').map(Number);return p.length===3&&p[0]?new Date(p[0],p[1]-1,p[2]):null};
const addD=(s,n)=>{const d=parse(s)||new Date();d.setDate(d.getDate()+n);return iso(d)};
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dn=s=>DN[parse(s).getDay()];
const sd=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const CATS=['Food & supplies','Salaries','Rent','Utilities','Maintenance','Cleaning & packaging','Other'];
function monday(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
const emptyLedger=()=>({name:'',cur:'$',week:monday(),days:{}});
let S=emptyLedger();
let persistLedger=null;
const save=()=>persistLedger?.(JSON.stringify(S));

window.restaurantAccounts={
  open(serialized, persist){
    if(MI>=0){MI=-1;$('md').hidden=true;$('ml').replaceChildren()}
    let data;
    try { data=JSON.parse(serialized); } catch {}
    S=emptyLedger();
    if(data && typeof data==='object'){
      S.name=typeof data.name==='string'?data.name:'';
      S.cur=typeof data.cur==='string'?data.cur:'$';
      if(typeof data.week==='string' && /^\d{4}-\d{2}-\d{2}$/.test(data.week)) S.week=data.week;
      if(data.days && typeof data.days==='object'){
        for(const [date, record] of Object.entries(data.days)){
          if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || !record || typeof record!=='object') continue;
          if(Array.isArray(record.inc)) record.inc=record.inc.filter(e=>e && typeof e.a==='string');
          norm(record);
          S.days[date]={
            cash: typeof record.cash==='string'?record.cash:'',
            credit: typeof record.credit==='string'?record.credit:'',
            exp: Array.isArray(record.exp)?record.exp.filter(e=>e && typeof e==='object').map(e=>({
              a:typeof e.a==='string'?e.a:'',
              c:CATS.includes(e.c)?e.c:CATS[0],
              n:typeof e.n==='string'?e.n:'',
              t:e.t==='credit'?'credit':'cash'
            })):[]
          };
        }
      }
    }
    persistLedger=persist;
    render();
  },
  save,
  close(){
    persistLedger=null;
    MI=-1;
    $('md').hidden=true;
    $('ml').replaceChildren();
    $('pv')?.remove();
    S=emptyLedger();
    render();
  }
};
const dates=()=>Array.from({length:7},(_,i)=>addD(S.week,i));
const sum=a=>a.reduce((t,e)=>t+num(e.a),0);
const isCr=e=>!!e&&e.t==='credit';
const norm=o=>{
  if(Array.isArray(o.inc)){
    if(o.cash===undefined&&o.credit===undefined){const cr=sum(o.inc.filter(isCr)),c=sum(o.inc)-cr;o.credit=cr?String(cr):'';o.cash=c?String(c):''}
    delete o.inc}
  if(o.cash===undefined)o.cash='';if(o.credit===undefined)o.credit='';if(!Array.isArray(o.exp))o.exp=[];return o};
const day=d=>norm(S.days[d]||(S.days[d]={}));
const tot=d=>{const o=S.days[d];if(!o)return{i:0,e:0,ci:0,cr:0,ec:0,ek:0};norm(o);const ci=num(o.cash),cr=num(o.credit),ek=sum(o.exp.filter(isCr)),e=sum(o.exp);return{i:ci+cr,e:e,ci:ci,cr:cr,ec:e-ek,ek:ek}};
const money=n=>fmt(n)+' '+S.cur;
const cards=t=>{
  const b=(c,l,v,a,z)=>'<section class="sc '+c+'"><div class="l">'+l+'</div><div class="v">' +esc(money(v))+'</div><div class="two"><div><span>'+a[0]+'</span><b>'+esc(money(a[1]))+'</b></div><div><span>'+z[0]+'</span><b>'+esc(money(z[1]))+'</b></div></div></section>';
  return b('net','NET PROFIT',t.i-t.e,['CASH NET',t.ci-t.ec],['CREDIT NET',t.cr-t.ek])+b('ex','EXPENSES',t.e,['CASH',t.ec],['CREDIT',t.ek])+b('in','TOTAL INCOME',t.i,['CASH',t.ci],['CREDIT',t.cr]);
};
function head(){$('bn').textContent=S.name||'Restaurant Accounts';const d=dates();$('bt').textContent='Week: '+sd(d[0])+' - '+sd(d[6])+' ('+d[0].slice(0,4)+')'}
function totals(){
  const W={i:0,e:0,ci:0,cr:0,ec:0,ek:0};
  dates().forEach(x=>{const q=tot(x);for(const k in W)W[k]+=q[k]});
  $('wsum').innerHTML=cards(W);
}
function drawDays(){
  $('days').innerHTML=dates().map((x,i)=>{const o=day(x),t=tot(x);
    return '<div class="dr"><div class="dh"><div><b>'+dn(x)+'</b><span>'+sd(x)+'</span></div><div class="dt" id="rt'+i+'">'+esc(money(t.i-t.e))+'</div></div>'
    +'<div class="g3"><div><label class="lc">CREDIT</label><input type="number" inputmode="decimal" placeholder="0.00" data-i="'+i+'" data-f="credit" value="'+esc(o.credit)+'"></div>'
    +'<div><label class="lk">CASH</label><input type="number" inputmode="decimal" placeholder="0.00" data-i="'+i+'" data-f="cash" value="'+esc(o.cash)+'"></div>'
    +'<div><label class="le">EXPENSES</label><button type="button" class="eb" data-e="'+i+'" id="re'+i+'">'+esc(money(t.e))+'</button></div></div></div>'}).join('');
}
function upd(i){
  const t=tot(dates()[i]),a=$('rt'+i),b=$('re'+i);
  if(a)a.textContent=money(t.i-t.e);if(b)b.textContent=money(t.e);totals();
}
function render(){head();$('wk').value=S.week;$('nm').value=S.name;$('cu').value=S.cur;drawDays();totals()}

let MI=-1;
function mtot(){const t=tot(dates()[MI]);$('mc').textContent=money(t.ec);$('mk').textContent=money(t.ek)}
function drawM(){
  const o=day(dates()[MI]);
  $('ml').innerHTML=o.exp.map((e,j)=>'<div class="row"><select class="c" data-j="'+j+'" data-f="c">'+CATS.map(c=>'<option'+(c===e.c?' selected':'')+'>'+c+'</option>').join('')+'</select><input class="a" type="number" inputmode="decimal" placeholder="Amount" data-j="'+j+'" data-f="a" value="'+esc(e.a)+'"><select class="t" data-j="'+j+'" data-f="t"><option value="cash"'+(e.t==='credit'?'':' selected')+'>Cash</option><option value="credit"'+(e.t==='credit'?' selected':'')+'>Credit</option></select><input class="n" placeholder="What is this expense?" data-j="'+j+'" data-f="n" value="'+esc(e.n)+'"><button class="x" type="button" data-dj="'+j+'">×</button></div>').join('');
  mtot();
}
function openM(i){
  MI=i;const x=dates()[i];$('mt').textContent='Expenses - '+dn(x)+' '+sd(x);
  const o=day(x);if(!o.exp.length){o.exp.push({c:CATS[0],a:'',t:'cash',n:''});save()}
  drawM();$('md').hidden=false;
}
function closeM(){
  if(MI>=0){const o=day(dates()[MI]);o.exp=o.exp.filter(e=>num(e.a)||e.n);save();upd(MI)}
  MI=-1;$('md').hidden=true;
}
const onIn=e=>{
  if(!persistLedger)return;
  const t=e.target;
  if(t.id==='nm'){S.name=t.value;head();save();return}
  if(t.id==='cu'){S.cur=t.value;drawDays();totals();save();return}
  if(t.id==='wk'){if(parse(t.value)){S.week=t.value;save();render()}return}
  if(t.dataset.j!=null&&MI>=0){const o=day(dates()[MI]);if(o.exp[+t.dataset.j]){o.exp[+t.dataset.j][t.dataset.f]=t.value;save();upd(MI);mtot()}return}
  if(t.dataset.i!=null&&t.dataset.f){day(dates()[+t.dataset.i])[t.dataset.f]=t.value;save();upd(+t.dataset.i)}
};
document.addEventListener('input',onIn);
document.addEventListener('change',onIn);
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.e!=null)openM(+t.dataset.e);
  else if(t.dataset.dj!=null&&MI>=0){day(dates()[MI]).exp.splice(+t.dataset.dj,1);save();drawM();upd(MI)}
});
$('ma').onclick=()=>{if(MI<0)return;day(dates()[MI]).exp.push({c:CATS[0],a:'',t:'cash',n:''});save();drawM();upd(MI)};
$('mx').onclick=closeM;
$('md').onclick=e=>{if(e.target===$('md'))closeM()};
$('nx').onclick=()=>{S.week=addD(S.week,7);save();render()};

function canvases(){
  const pages=[];let c,x,y;
  const np=()=>{c=document.createElement('canvas');c.width=1240;c.height=1754;x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1240,1754);pages.push(c);y=80};
  const T=(t,px,py,o)=>{o=o||{};x.direction='ltr';x.font=(o.b?'bold ':'')+(o.s||28)+'px Arial,Helvetica,sans-serif';x.fillStyle=o.c||'#1c2b33';x.textAlign=o.a||'left';x.fillText(t,px,py)};
  const R=(py,h,col)=>{x.fillStyle=col;x.fillRect(70,py,1100,h)};
  const row=(a,b,cc,d,o)=>{T(a,90,y,o);T(b,660,y,Object.assign({a:'center'},o));T(cc,850,y,Object.assign({a:'center'},o));T(d,1050,y,Object.assign({a:'center'},o))};
  np();x.fillStyle='#0f8b8d';x.fillRect(0,0,1240,190);
  const d=dates();
  T(S.name||'Restaurant Accounts',70,85,{s:48,b:1,c:'#fff'});
  T('Weekly report: '+sd(d[0])+' - '+sd(d[6])+' / '+d[6].slice(0,4),70,145,{s:30,c:'#fff'});
  y=270;R(y-45,62,'#d7efee');row('Day','Income','Expenses','Net',{b:1,c:'#094f51'});
  let wi=0,we=0,wci=0,wcr=0,wec=0,wek=0;
  d.forEach(z=>{y+=70;const q=tot(z);wi+=q.i;we+=q.e;wci+=q.ci;wcr+=q.cr;wec+=q.ec;wek+=q.ek;row(dn(z)+' '+sd(z),fmt(q.i),fmt(q.e),fmt(q.i-q.e),{c:'#1c2b33'});x.fillStyle='#cfd9df';x.fillRect(70,y+20,1100,2)});
  y+=80;R(y-45,62,'#0f8b8d');row('Total',fmt(wi),fmt(we),fmt(wi-we),{b:1,c:'#fff'});
  const mm=v=>fmt(v)+' '+S.cur;
  const blk=(title,v0,l1,v1,l2,v2,bg,col,sub)=>{
    y+=20;const tp=y;x.fillStyle=bg;x.fillRect(70,tp,1100,140);
    T(title,100,tp+46,{b:1,c:col,s:30});T(mm(v0),1140,tp+46,{a:'right',b:1,c:col,s:36});
    x.fillStyle=sub;x.fillRect(95,tp+68,525,58);x.fillRect(630,tp+68,515,58);
    T(l1,115,tp+107,{b:1,c:col,s:25});T(mm(v1),600,tp+107,{a:'right',b:1,c:col,s:29});
    T(l2,650,tp+107,{b:1,c:col,s:25});T(mm(v2),1125,tp+107,{a:'right',b:1,c:col,s:29});
    y=tp+140;
  };
  y+=30;
  blk('TOTAL INCOME',wi,'Cash',wci,'Credit',wcr,'#e3ecfb','#1f4fb2','#cddbf6');
  blk('NET PROFIT',wi-we,'Cash net',wci-wec,'Credit net',wcr-wek,'#e6f4ea','#1e7a33','#cde7d4');
  blk('EXPENSES',we,'Cash',wec,'Credit',wek,'#fbe6e8','#b02a3a','#f4ccd1');
  T('Currency: '+S.cur,90,y+70,{s:24,c:'#5f7f8f'});
  y+=150;T('Daily details',70,y,{s:36,b:1,c:'#094f51'});y+=30;
  d.forEach(z=>{
    const o=S.days[z];if(!o)return;norm(o);
    const items=[];
    if(num(o.cash))items.push(['Income - Cash',num(o.cash),'#2f9e44']);
    if(num(o.credit))items.push(['Income - Credit',num(o.credit),'#2f9e44']);
    o.exp.forEach(e=>{if(num(e.a)||e.n)items.push(['Expense - '+e.c+' - '+(e.t==='credit'?'Credit':'Cash')+(e.n?': '+String(e.n).slice(0,40):''),num(e.a),'#d6336c'])});
    if(!items.length)return;
    if(y>1500)np();
    y+=65;R(y-42,58,'#d7efee');T(dn(z)+' '+sd(z),90,y,{b:1,c:'#094f51'});
    items.forEach(m=>{if(y>1680)np();y+=52;T(m[0],100,y,{s:25});T(fmt(m[1]),1150,y,{a:'right',s:25,b:1,c:m[2]})});
    y+=25;
  });
  return pages;
}
function buildPdf(){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
  const doc=new J({unit:'pt',format:'a4'});
  canvases().forEach((c,i)=>{if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,595.28,841.89)});
  return doc;
}
let D=null;
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{D=d}).catch(()=>{})}catch(e){}
function preview(){
  if($('pv'))return;
  const w=document.createElement('div');w.id='pv';
  w.innerHTML='<div class="pvh"><span>Press and hold an image, then choose Share or Save</span><button type="button" id="pvx">Close</button></div>'+canvases().map(c=>'<img alt="Report" src="'+c.toDataURL('image/jpeg',0.9)+'">').join('');
  document.body.appendChild(w);$('pvx').onclick=()=>w.remove();
}
$('pdf').onclick=async()=>{
  const b=$('pdf'),o=b.textContent,doc=buildPdf();
  const f=t=>{b.textContent=t;setTimeout(()=>{b.textContent=o},2200)};
  if(!doc){f('Could not create file');return}
  const name='Weekly_Report_'+S.week+'.pdf';
  try{
    const buf=doc.output('arraybuffer');
    if(D){await D.save({filename:name,data:buf})}
    else{const u=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
    f('Saved');
  }catch(e){if(e&&e.code==='declined')return;preview()}
};
$('sh').onclick=async()=>{
  const b=$('sh'),o=b.textContent,doc=buildPdf();
  const f=t=>{b.textContent=t;setTimeout(()=>{b.textContent=o},2200)};
  if(!doc){f('Could not create file');return}
  const name='Weekly_Report_'+S.week+'.pdf',buf=doc.output('arraybuffer');
  try{
    const file=new File([buf],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  if(D){try{await D.save({filename:name,data:buf});f('Saved');return}catch(e){if(e&&e.code==='declined')return}}
  preview();
};
render();
</script>
