<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Restaurant Accounts</title>
<meta name="theme-color" content="#0b6145">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/app-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/app-180.png">
<script defer src="./register-pwa.js"></script>
<style>
:root{--bg:#eef4f7;--card:#fff;--tx:#1c2b33;--bd:#cfd9df;--g:#2f9e44;--r:#d6336c;--b:#0f8b8d;--inp:#fff;--row:#f6f9fb;--mut:#6b7c86;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161b2e;--card:#232a45;--tx:#eef1fa;--bd:#3a4468;--inp:#111729;--row:#1f2740;--mut:#8f9ab8}}
:root[data-theme="dark"]{--bg:#161b2e;--card:#232a45;--tx:#eef1fa;--bd:#3a4468;--inp:#111729;--row:#1f2740;--mut:#8f9ab8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif}
.ban{background:linear-gradient(135deg,#0f8b8d,#2f6fdb);color:#fff;border-radius:0 0 22px 22px;padding:18px;text-align:center}
.bn{font-size:22px;font-weight:bold}.bn button{background:none;color:inherit;border:0;font:inherit;text-decoration:underline;text-underline-offset:4px;cursor:pointer}.bt{font-size:13px;margin-top:6px;opacity:.95}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
label{display:block;font-size:12px;font-weight:bold;margin:8px 0 3px}
label:first-child{margin-top:0}
input,select{background:var(--inp);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 8px;font:inherit;font-size:16px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#8f9ab8 50%),linear-gradient(135deg,#8f9ab8 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
h3{margin:0 0 8px;font-size:15px}
.dr{background:var(--row);border:1px solid var(--bd);border-radius:16px;padding:10px;margin-bottom:10px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.dh b{font-size:17px}.dh span{color:var(--mut);font-size:13px;margin-left:6px}
.dt{font-weight:bold;font-size:17px;direction:ltr}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g3 label{font-size:12px;letter-spacing:.04em;margin:0 0 3px}
.lc{color:#6f9cf0}.lk{color:#4fb96b}.le{color:#e8736f}
.g3 input,.eb{height:46px}
.eb{width:100%;border:1.5px dashed #e8736f;background:transparent;color:#e8736f;border-radius:12px;font:bold 15px Arial;padding:0 4px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--bd)}
.row .a{flex:0 0 110px}.row .n{flex:1 1 120px}.row .c{flex:1 1 100%}.row .t{flex:0 0 92px}
.x{flex:0 0 42px;border:1px solid var(--r);background:transparent;color:var(--r);border-radius:10px;font:bold 18px Arial;cursor:pointer}
.add{width:100%;border:0;border-radius:12px;padding:12px;font:bold 14px Arial;color:#fff;cursor:pointer;background:var(--r)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.b{border:0;border-radius:12px;padding:14px 6px;font:bold 14px Arial;color:#fff;cursor:pointer;background:#2f6fdb}
.b.s{background:#f2c14e;grid-column:1/-1}
.sc{border-radius:20px;padding:16px;margin:0 0 12px;border:1px solid #3a4468}
.sc .l{font-size:13px;font-weight:bold;letter-spacing:.06em}
.sc .v{font-size:32px;font-weight:bold;margin:2px 0 12px;direction:ltr;text-align:left}
.sc .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc .two div{border-radius:14px;padding:10px 12px}
.sc .two span{display:block;font-size:12px;font-weight:bold;letter-spacing:.05em}
.sc .two b{display:block;font-size:19px;margin-top:2px;direction:ltr;text-align:left}
.sc.net{background:#0d1117;color:#fff}.sc.net .two div{background:#252830}.sc.net .two span{color:#c9ced8}
.sc.ex{background:#381819;color:#e8736f}.sc.ex .two div{background:#4a2022}
.sc.in{background:#18274a;color:#86aef8}.sc.in .two div{background:#1c2b5a}
.md{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.md[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.mh h3{margin:0;color:#e8736f;font-size:16px}
.mh button{border:0;border-radius:10px;background:#2f6fdb;color:#fff;font:bold 14px Arial;padding:10px 16px;cursor:pointer}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mc div{background:#381819;color:#e8736f;border-radius:12px;padding:10px;font-size:12px;font-weight:bold}
.mc b{display:block;font-size:17px;margin-top:2px;direction:ltr}
#pv{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:0 10px env(safe-area-inset-bottom,0px)}
#pv img{width:100%;display:block;margin:0 0 10px;border-radius:8px;background:#fff}
.pvh{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;font-size:13px;position:sticky;top:0;background:var(--bg)}
.pvh button{flex:none;border:0;border-radius:10px;background:#2f6fdb;color:#fff;font:bold 14px Arial;padding:10px 14px}
.ledger-tools h3{margin-top:16px}
.ledger-tools h3:first-child{margin-top:0}
.ledger-tools button{min-height:44px;border:1px solid var(--bd);border-radius:12px;padding:8px;background:var(--inp);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.ledger-tools button:disabled{opacity:.5;cursor:default}
.ledger-tools .primary-report{background:#0b6145;color:white}
.ledger-tools .clear-week{color:#a43a31;background:#fff4f0;border-color:#ebd1cc;width:100%;margin-top:12px}
.week-select{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-block:9px}
.week-select output{text-align:center;font-weight:700}
.ledger-tools #nx{width:100%}
[dir="rtl"] .dh span{margin-inline-start:6px;margin-left:0}
.ledger-field-row{display:flex;align-items:stretch;gap:8px}
.ledger-field-row input{flex:1;min-width:0}
.ledger-field-row button{border:0;border-radius:12px;padding:8px 14px;background:#0b6145;color:white;font:inherit;font-weight:700;cursor:pointer}
.salary-summary{width:100%;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:10px;padding:12px;border:1px solid #e8736f;border-radius:14px;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer;text-align:start}
.salary-summary:hover,.salary-summary:focus-visible{background:#4a2022}
.salary-worker{flex:1 1 100%;display:grid;gap:6px;min-width:0}
.salary-worker details{padding:4px 0}
.salary-worker summary{font-weight:700;cursor:pointer}
.salary-worker form{display:flex;gap:6px;margin-top:6px}
.salary-worker form button{flex:none;width:auto;padding-inline:10px}
.salary-group{padding:12px 0;border-bottom:1px solid #e1e2dc}
.salary-group ul{list-style:none;margin:7px 0 0;padding:0}
.salary-group li{display:flex;justify-content:space-between;gap:8px;padding-block:3px;color:#496158}
.salary-group bdi{overflow-wrap:anywhere}
.worker-card{border-top:1px solid var(--bd);padding:12px 0;margin-top:12px}
.worker-card p{margin:8px 0}
.worker-heading,.worker-pay-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.worker-heading strong{flex:1 1 120px;overflow-wrap:anywhere}
.worker-pay-actions input{flex:1 1 100px;width:auto}
.ledger-tools .remove-worker{color:#a43a31;background:#fff4f0}
.access-ui.timesheet{width:min(calc(100% - 24px),600px)}
.timesheet-days{display:grid;gap:8px;margin-top:12px}
.work-shift{min-width:0;margin:0;padding:8px;border:1px solid #e1e2dc;border-radius:10px}
.work-shift legend{font-weight:700;padding-inline:4px}
.access-ui .shift-off{display:flex;align-items:center;gap:6px;margin:0 0 5px}
.access-ui .shift-off input{appearance:auto;width:18px;min-height:18px;margin:0;accent-color:#0b6145}
.shift-times{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.shift-times output{grid-column:1/-1;text-align:end;font-weight:700}
.shift-times input:disabled{opacity:.5}
.timesheet-total{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding:10px;background:#e8f3ed;border-radius:10px}
</style>
<link rel="stylesheet" href="./access.css">
</head>
<body>
<section class="access-ui sign-in" id="sign-in"></section>
<section class="access-ui access-bar" id="access-bar" hidden></section>
<dialog class="access-ui dialog" id="access-dialog"></dialog>
<div id="accounts-app" hidden>
<header class="ban"><div class="bn"><button type="button" id="bn" data-action="edit-restaurant">Restaurant Accounts</button></div><div class="bt" id="bt"></div></header>
<main>
<section class="card">
<form id="restaurant-title-form">
  <label for="restaurant-title" data-i18n="Restaurant name">Restaurant name</label>
  <div class="ledger-field-row">
    <input id="restaurant-title" type="text" maxlength="80" required
      placeholder="Restaurant name" data-placeholder="Restaurant name">
    <button type="submit" data-i18n="Save">Save</button>
  </div>
</form>
<form id="week-start-form">
  <label for="wk" data-i18n="Week starts">Week starts</label>
  <div class="ledger-field-row">
    <input id="wk" type="date" required>
    <button type="submit" data-i18n="Start week">Start week</button>
  </div>
</form>
<label for="cu" data-i18n="Currency">Currency</label><input id="cu" placeholder="$">
</section>
<section class="card ledger-tools workforce">
  <h3 data-i18n="Workers">Workers</h3>
  <form id="worker-roster-form" class="ledger-field-row">
    <input name="worker" maxlength="80" required aria-label="Worker name"
      placeholder="Worker name" data-placeholder="Worker name">
    <button type="submit" data-i18n="Add worker">Add worker</button>
  </form>
  <div id="workforce-list"></div>
</section>
<div id="days"></div>
<section class="card"><h3 data-i18n="Week total">Week total</h3><div id="wsum"></div></section>
<section class="card ledger-tools">
  <h3 data-i18n="Weeks">Weeks</h3>
  <label for="saved-weeks" data-i18n="Saved weeks">Saved weeks</label>
  <select id="saved-weeks"></select>
  <div class="week-select">
    <button id="older" type="button" data-i18n="Older">Older</button>
    <output id="week-range"></output>
    <button id="newer" type="button" data-i18n="Newer">Newer</button>
  </div>
  <button id="nx" type="button" data-i18n="Save week and start next">Save week and start next</button>
  <h3 data-i18n="Reports">Reports</h3>
  <div class="btns">
    <button class="primary-report" id="pdf" type="button" data-i18n="Save as PDF">Save as PDF</button>
    <button id="csv" type="button" data-i18n="Export Excel (CSV)">Export Excel (CSV)</button>
    <button id="sh" type="button" data-i18n="Share PDF">Share PDF</button>
  </div>
  <h3 data-i18n="Backup">Backup</h3>
  <div class="btns">
    <button id="export-backup" type="button" data-i18n="Export backup">Export backup</button>
    <button id="import-backup" type="button" data-i18n="Import backup">Import backup</button>
  </div>
  <input type="file" id="backup-file" accept=".json,application/json" hidden>
  <button class="clear-week" id="clear-week" type="button" data-i18n="Clear this week’s numbers">Clear this week’s numbers</button>
</section>
</main>
<div class="md" id="md" hidden><div class="sheet"><div class="mh"><h3 id="mt"></h3><button id="mx" type="button" data-i18n="Done">Done</button></div><div id="ml"></div><button class="add" id="ma" type="button" data-i18n="+ Add expense">+ Add expense</button><div class="mc"><div><span data-i18n="CASH EXPENSES">CASH EXPENSES</span><b id="mc"></b></div><div><span data-i18n="CREDIT EXPENSES">CREDIT EXPENSES</span><b id="mk"></b></div></div></div></div>
<dialog class="access-ui dialog" id="salary-dialog" aria-labelledby="salary-title">
  <h2 id="salary-title" data-i18n="Weekly salaries">Weekly salaries</h2>
  <p id="salary-period"></p>
  <div id="salary-breakdown"></div>
  <form method="dialog" class="dialog-footer">
    <button class="outline" type="submit" data-i18n="Close">Close</button>
  </form>
</dialog>
<dialog class="access-ui dialog timesheet" id="timesheet" aria-labelledby="timesheet-title">
  <h2 id="timesheet-title" data-i18n="Work schedule">Work schedule</h2>
  <p id="timesheet-worker"></p>
  <label for="hourly-rate" data-i18n="Hourly rate">Hourly rate</label>
  <input id="hourly-rate" type="number" min="0" max="999999999" step="0.01" inputmode="decimal">
  <div id="timesheet-days" class="timesheet-days"></div>
  <div class="timesheet-total">
    <strong data-i18n="Week total">Week total</strong>
    <output id="timesheet-total"></output>
  </div>
  <form method="dialog" class="dialog-footer">
    <button class="outline" type="submit" data-i18n="Done">Done</button>
  </form>
</dialog>
</div>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=String(s||'').split('-').map(Number);return p.length===3&&p[0]?new Date(p[0],p[1]-1,p[2]):null};
const addD=(s,n)=>{const d=parse(s)||new Date();d.setDate(d.getDate()+n);return iso(d)};
const translations = {
  'Restaurant Accounts':'حسابات المطعم', 'Restaurant name':'اسم المطعم', 'Week starts':'بداية الأسبوع', 'Start week':'ابدأ الأسبوع',
  Currency:'العملة', 'Week total':'إجمالي الأسبوع', Done:'تم', '+ Add expense':'إضافة مصروف',
  'CASH EXPENSES':'المصروفات النقدية', 'CREDIT EXPENSES':'المصروفات الآجلة',
  Save:'حفظ', Weeks:'الأسابيع', 'Saved weeks':'الأسابيع المحفوظة', Older:'الأقدم', Newer:'الأحدث',
  'Save week and start next':'حفظ الأسبوع وبدء التالي', Current:'الحالي',
  Reports:'التقارير', 'Save as PDF':'حفظ PDF', 'Export Excel (CSV)':'تصدير Excel ‏(CSV)',
  'Share PDF':'مشاركة PDF', Backup:'النسخ الاحتياطي', 'Export backup':'تصدير نسخة احتياطية',
  'Import backup':'استيراد نسخة احتياطية', 'Clear this week’s numbers':'مسح أرقام هذا الأسبوع',
  'Clear all income and expenses for the selected week?':'هل تريد مسح كل الإيرادات والمصروفات للأسبوع المعروض؟',
  'Replace the entire ledger, including saved weeks, with this backup?':'هل تريد استبدال الدفتر كاملًا، بما فيه الأسابيع المحفوظة، بهذه النسخة؟',
  'Invalid or oversized backup file.':'ملف النسخة الاحتياطية غير صالح أو يتجاوز الحد المسموح.',
  'NET PROFIT':'صافي الربح', 'CASH NET':'صافي النقدي', 'CREDIT NET':'صافي الآجل',
  EXPENSES:'المصروفات', 'TOTAL INCOME':'إجمالي الإيرادات', CREDIT:'آجل', CASH:'نقدي',
  'Food & supplies':'الأغذية والمستلزمات', Salaries:'الرواتب', Rent:'الإيجار', Utilities:'الخدمات',
  Maintenance:'الصيانة', 'Cleaning & packaging':'التنظيف والتغليف', Other:'أخرى',
  Amount:'المبلغ', Cash:'نقدي', Credit:'آجل', 'What is this expense?':'وصف المصروف',
  'Remove expense':'حذف المصروف', Expenses:'المصروفات', 'Weekly report':'التقرير الأسبوعي',
  Day:'اليوم', Date:'التاريخ', Income:'الإيرادات', Net:'الصافي', Total:'الإجمالي',
  'Cash net':'صافي النقدي', 'Credit net':'صافي الآجل', 'Daily details':'التفاصيل اليومية',
  Expense:'مصروف', 'Could not create file':'تعذّر إنشاء الملف', Saved:'تم الحفظ', Close:'إغلاق',
  'Press and hold an image, then choose Share or Save':'اضغط مطولًا على الصورة، ثم اختر مشاركة أو حفظ',
  Workers:'العمال', 'Add worker':'أضف عاملًا', 'Work schedule':'جدول الساعات',
  'No workers added yet.':'لم تُضف أي عامل بعد.', 'Remove worker':'حذف العامل',
  'Remove this worker from the list? Saved hours and salaries will be kept.':'هل تريد حذف العامل من القائمة؟ ستبقى الساعات والرواتب المحفوظة.',
  'Suggested salary':'الراتب المقترح', 'Weekly salary':'الراتب الأسبوعي',
  'Use suggested amount':'استخدم المبلغ المقترح', 'Record salary':'سجّل الراتب', 'Update salary':'حدّث الراتب',
  'This worker already has a manual salary expense this week. Record another salary?':'لهذا العامل راتب مسجّل يدويًا هذا الأسبوع. هل تريد تسجيل راتب آخر؟',
  'Hourly rate':'أجر الساعة', 'Day off':'يوم إجازة', Start:'الدخول', End:'الخروج',
  'Weekly salaries':'رواتب الأسبوع', 'Worker name':'اسم العامل', 'Select worker':'اختر العامل',
  'Add worker name':'أضف اسم عامل', 'Save worker':'حفظ الاسم',
  'No salaries this week.':'لا توجد رواتب مسجّلة لهذا الأسبوع.',
  'Unnamed worker':'عامل بلا اسم', Report:'التقرير', 'Weekly summary':'ملخص الأسبوع', 'Expense details':'تفاصيل المصروفات',
  Category:'الفئة', 'Payment method':'طريقة الدفع', Notes:'الملاحظات', Page:'صفحة'
};
const ar=()=>document.documentElement.lang==='ar';
const L=text=>ar()?(translations[text]||text):text;
const locale=()=>ar()?'ar':'en-US';
const dn=s=>parse(s).toLocaleDateString(locale(),{weekday:'long'});
const sd=s=>parse(s).toLocaleDateString(locale(),{month:'short',day:'numeric'});
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&parse(s)!==null&&iso(parse(s))===s;
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmt=n=>(Math.round(n*100)/100).toLocaleString(locale());
const SALARIES='Salaries';
const CATS=['Food & supplies',SALARIES,'Rent','Utilities','Maintenance','Cleaning & packaging','Other'];
function monday(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
const emptyLedger=()=>({name:'',cur:'$',week:monday(),savedWeeks:[],workers:[],removedWorkers:[],timesheets:[],days:{}});
let S=emptyLedger();
let viewWeek=null;
const selectedWeek=()=>viewWeek||S.week;
let persistLedger=null;
const save=()=>persistLedger?.(JSON.stringify(S));

const workerName=value=>typeof value==='string'?value.trim().slice(0,80):'';
function rememberWorker(workers,value){
  const name=workerName(value);
  if(!name)return '';
  const known=workers.find(worker=>worker.toLowerCase()===name.toLowerCase());
  if(known)return known;
  workers.push(name);
  return name;
}

const validTime=value=>typeof value==='string'&&/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value);
function wageValue(value){
  const amount=Number(value);
  return typeof value==='string'&&value.trim()!==''&&Number.isFinite(amount)
    &&amount>=0&&amount<=999999999?String(Math.round(amount*100)/100):'';
}
function addLedgerWorker(value){
  const name=workerName(value);
  if(!name)return '';
  const index=S.removedWorkers.findIndex(worker=>worker.toLowerCase()===name.toLowerCase());
  const worker=index===-1?name:S.removedWorkers.splice(index,1)[0];
  return rememberWorker(S.workers,worker);
}

function normalizeLedger(data){
  const ledger=emptyLedger();
  if(!data||typeof data!=='object')return ledger;
  if(typeof data.name==='string')ledger.name=data.name;
  if(typeof data.cur==='string')ledger.cur=data.cur;
  if(validDate(data.week))ledger.week=data.week;
  if(Array.isArray(data.savedWeeks))ledger.savedWeeks=[...new Set(data.savedWeeks.filter(validDate))];
  if(Array.isArray(data.removedWorkers)){
    for(const name of data.removedWorkers)rememberWorker(ledger.removedWorkers,name);
  }
  const restoreWorker=value=>{
    const name=workerName(value);
    const removed=ledger.removedWorkers.find(worker=>worker.toLowerCase()===name.toLowerCase());
    return removed||rememberWorker(ledger.workers,name);
  };
  if(Array.isArray(data.workers))for(const name of data.workers)restoreWorker(name);
  if(Array.isArray(data.timesheets)){
    for(const sheet of data.timesheets){
      if(!validDate(sheet?.week)||!workerName(sheet.worker))continue;
      const worker=restoreWorker(sheet.worker);
      if(ledger.timesheets.some(item=>item.worker===worker&&item.week===sheet.week))continue;
      const shifts={};
      for(const date of dates(sheet.week)){
        const shift=sheet.shifts?.[date];
        const start=validTime(shift?.start)?shift.start:'';
        const end=validTime(shift?.end)?shift.end:'';
        const off=shift?.off===true;
        if(start||end||off)shifts[date]={start,end,off};
      }
      ledger.timesheets.push({worker,week:sheet.week,rate:wageValue(sheet.rate),shifts});
    }
  }
  if(data.days&&typeof data.days==='object'){
    for(const [date, record] of Object.entries(data.days)){
      if(!validDate(date)||!record||typeof record!=='object'||Array.isArray(record))continue;
      if(Array.isArray(record.inc))record.inc=record.inc.filter(e=>e&&typeof e.a==='string');
      norm(record);
      ledger.days[date]={
        cash:typeof record.cash==='string'?record.cash:'',
        credit:typeof record.credit==='string'?record.credit:'',
        exp:record.exp.filter(e=>e&&typeof e==='object').map(e=>({
          a:typeof e.a==='string'?e.a:'',
          c:CATS.includes(e.c)?e.c:CATS[0],
          n:typeof e.n==='string'?e.n:'',
          ...(e.c===SALARIES&&workerName(e.worker)?{worker:restoreWorker(e.worker)}:{}),
          ...(e.c===SALARIES&&workerName(e.worker)&&validDate(e.payrollWeek)
            &&dates(e.payrollWeek).includes(date)?{payrollWeek:e.payrollWeek}:{}),
          t:e.t==='credit'?'credit':'cash'
        }))
      };
    }
  }
  return ledger;
}

const dates=(week=selectedWeek())=>Array.from({length:7},(_,i)=>addD(week,i));
const dateOrdinal=date=>Date.parse(date+'T00:00:00Z')/86400000;
function weeks(){
  const starts=new Set([S.week,...S.savedWeeks,...S.timesheets.map(sheet=>sheet.week)]);
  const covered=new Set([...starts].flatMap(week=>dates(week)));
  for(const [date,record] of Object.entries(S.days)){
    if(covered.has(date)||!(record.cash||record.credit||record.exp.length))continue;
    const offset=Math.floor((dateOrdinal(date)-dateOrdinal(S.week))/7)*7;
    starts.add(addD(S.week,offset));
  }
  return [...starts].sort();
}
function weekLabel(week){
  const end=addD(week,6);
  return sd(week)+' – '+parse(end).toLocaleDateString(locale(),{month:'short',day:'numeric',year:'numeric'});
}
function showWeek(week){
  viewWeek=week===S.week?null:week;
  render();
}
function changeCurrentWeek(week){
  if(!persistLedger||!validDate(week))return;
  if(week===S.week){showWeek(week);return}
  S.savedWeeks=[...new Set([...weeks(),S.week])].filter(start=>start!==week);
  S.week=week;
  showWeek(week);
  save();
}
const sum=a=>a.reduce((t,e)=>t+num(e.a),0);
const isCr=e=>!!e&&e.t==='credit';
const norm=o=>{
  if(Array.isArray(o.inc)){
    if(o.cash===undefined&&o.credit===undefined){const cr=sum(o.inc.filter(isCr)),c=sum(o.inc)-cr;o.credit=cr?String(cr):'';o.cash=c?String(c):''}
    delete o.inc}
  if(o.cash===undefined)o.cash='';if(o.credit===undefined)o.credit='';if(!Array.isArray(o.exp))o.exp=[];return o};
const day=d=>norm(S.days[d]||(S.days[d]={}));
const tot=d=>{const o=S.days[d];if(!o)return{i:0,e:0,ci:0,cr:0,ec:0,ek:0};norm(o);const ci=num(o.cash),cr=num(o.credit),ek=sum(o.exp.filter(isCr)),e=sum(o.exp);return{i:ci+cr,e:e,ci:ci,cr:cr,ec:e-ek,ek:ek}};
const money=n=>fmt(n)+' '+S.cur;
function weeklySalaries(){
  const groups=new Map();
  let total=0;
  for(const date of dates()){
    for(const expense of S.days[date]?.exp||[]){
      if(expense.c!==SALARIES||!num(expense.a))continue;
      const worker=expense.worker||'';
      const amount=num(expense.a);
      if(!groups.has(worker))groups.set(worker,{total:0,payments:[]});
      const group=groups.get(worker);
      group.total+=amount;
      group.payments.push({date,amount});
      total+=amount;
    }
  }
  return {groups,total};
}
const cards=(t,salaries)=>{
  const b=(c,l,v,a,z,extra='')=>'<section class="sc '+c+'"><div class="l">'+L(l)+'</div><div class="v">'+esc(money(v))+'</div><div class="two"><div><span>'+L(a[0])+'</span><b>'+esc(money(a[1]))+'</b></div><div><span>'+L(z[0])+'</span><b>'+esc(money(z[1]))+'</b></div></div>'+extra+'</section>';
  const salaryButton='<button type="button" class="salary-summary" id="weekly-salaries" aria-haspopup="dialog"><span>'+L(SALARIES)+'</span><bdi>'+esc(money(salaries))+'</bdi></button>';
  return b('net','NET PROFIT',t.i-t.e,['CASH NET',t.ci-t.ec],['CREDIT NET',t.cr-t.ek])
    +b('ex','EXPENSES',t.e,['CASH',t.ec],['CREDIT',t.ek],salaryButton)
    +b('in','TOTAL INCOME',t.i,['CASH',t.ci],['CREDIT',t.cr]);
};
function showSalaryDetails({groups,total}){

}
function head(){

function totals(){

function drawDays(){

    return '<div class="dr"><div class="dh"><div><b>'+dn(x)+'</b><span>'+sd(x)+'</span></div><div class="dt" id="rt'+i+'">'+esc(money(t.i-t.e))+'</div></div>'
    +'<div class="g3"><div><label class="lc">'+L('CREDIT')+'</label><input type="number" inputmode="decimal" placeholder="0.00" data-i="'+i+'" data-f="credit" value="'+esc(o.credit)+'"></div>'

function upd(i){

function render(){

let scheduleWorker='';

function workerSchedule(worker,week=selectedWeek()){
  return S.timesheets.find(sheet=>sheet.worker===worker&&sheet.week===week);
}
function defaultRate(worker,week=selectedWeek()){
  const prior=S.timesheets.filter(sheet=>sheet.worker===worker&&sheet.week<week&&sheet.rate!=='');
  return prior.sort((a,b)=>b.week.localeCompare(a.week))[0]?.rate||'';
}
function shiftMinutes(shift){
  if(!shift||shift.off||!validTime(shift.start)||!validTime(shift.end))return 0;
  const minute=time=>Number(time.slice(0,2))*60+Number(time.slice(3));
  return (minute(shift.end)-minute(shift.start)+1440)%1440;
}
const hoursLabel=minutes=>Math.floor(minutes/60)+':'+pad(minutes%60);
function scheduleTotals(worker){
  const sheet=workerSchedule(worker);
  const rate=Number(sheet?.rate??defaultRate(worker));
  const days=dates().map(date=>{
    const minutes=shiftMinutes(sheet?.shifts[date]);
    return {date,minutes,cents:Math.round(minutes*rate*100/60)};
  });
  return {days,minutes:days.reduce((sum,day)=>sum+day.minutes,0),
    cents:days.reduce((sum,day)=>sum+day.cents,0)};
}
function payrollEntry(worker){
  for(const record of Object.values(S.days)){
    const entry=record.exp.find(expense=>expense.c===SALARIES
      && expense.worker===worker&&expense.payrollWeek===selectedWeek());
    if(entry)return entry;
  }
}

function renderSchedule(){
  const sheet=workerSchedule(scheduleWorker);
  $('timesheet-worker').textContent=scheduleWorker+' · '+weekLabel(selectedWeek());
  $('hourly-rate').value=sheet?.rate??defaultRate(scheduleWorker);
  $('timesheet-days').innerHTML=dates().map((date,index)=>{
    const shift=sheet?.shifts[date]||{};
    const off=shift.off===true;
    return `<fieldset class="work-shift" data-shift-day="${index}">
      <legend>${dn(date)} · ${sd(date)}</legend>
      <label class="shift-off"><input type="checkbox" data-shift-field="off"${off?' checked':''}> ${L('Day off')}</label>
      <div class="shift-times">
        <label>${L('Start')}<input type="time" data-shift-field="start" value="${esc(shift.start||'')}"${off?' disabled':''}></label>
        <label>${L('End')}<input type="time" data-shift-field="end" value="${esc(shift.end||'')}"${off?' disabled':''}></label>
        <output data-shift-total></output>
      </div>
    </fieldset>`;
  }).join('');
  updateScheduleTotals();
}
function updateScheduleTotals(){
  const {days,minutes,cents}=scheduleTotals(scheduleWorker);
  $('timesheet-days').querySelectorAll('[data-shift-total]').forEach((output,index)=>{
    const day=days[index];
    output.textContent=hoursLabel(day.minutes)+' · '+money(day.cents/100);

$('workforce-list').addEventListener('click',event=>{

$('workforce-list').addEventListener('submit',event=>{
  const form=event.target;
  if(form.dataset.workerPay===undefined)return;
  event.preventDefault();
  const worker=S.workers[Number(form.dataset.workerPay)];
  const amount=wageValue(form.elements.amount.value);
  if(!persistLedger||!worker||Number(amount)<=0)return;
  const entry=payrollEntry(worker);
  if(entry){
    entry.a=amount;
  }else{
    const days=dates();
    const hasManualSalary=days.some(date=>S.days[date]?.exp.some(expense=>
      expense.c===SALARIES&&expense.worker===worker&&!expense.payrollWeek));
    if(hasManualSalary&&!confirm(L('This worker already has a manual salary expense this week. Record another salary?')))return;
    const week=selectedWeek();
    day(days[6]).exp.push({a:amount,c:SALARIES,n:'',t:'cash',worker,payrollWeek:week});
  }
  save();
  renderWorkers();
  drawDays();
  totals();
});
$('timesheet').addEventListener('change',event=>{
  const input=event.target;
  const field=input.dataset.shiftField;
  if(!persistLedger||!scheduleWorker||(input.id!=='hourly-rate'&&!field))return;
  if(!input.validity.valid)return;
  let sheet=workerSchedule(scheduleWorker);
  if(!sheet){
    sheet={worker:scheduleWorker,week:selectedWeek(),rate:defaultRate(scheduleWorker),shifts:{}};
    S.timesheets.push(sheet);
  }
  if(input.id==='hourly-rate'){
    sheet.rate=wageValue(input.value);
  }else{
    const row=input.closest('[data-shift-day]');
    const date=dates()[Number(row.dataset.shiftDay)];
    const shift=sheet.shifts[date]||={};
    if(field==='off'){
      shift.off=input.checked;
      row.querySelectorAll('input[type=time]').forEach(time=>{time.disabled=input.checked});
    }else{
      shift[field]=validTime(input.value)?input.value:'';
    }
    if(!shift.start&&!shift.end&&!shift.off)delete sheet.shifts[date];
  }
  save();
  updateScheduleTotals();
  renderWorkers();
});

  if(!persistLedger)return;

}

$('csv').onclick=()=>{
  const rows=[['Date','Day','Cash','Credit','Income','CASH EXPENSES','CREDIT EXPENSES','Expenses','Net','Currency'].map(L)];
  for(const date of dates()){
    const t=tot(date);
    const currency=/^\s*[=+@-]/.test(S.cur)? "'"+S.cur:S.cur;
    rows.push([date,dn(date),t.ci,t.cr,t.i,t.ec,t.ek,t.e,t.i-t.e,currency]);
  }
  const csv=rows.map(row=>row.map(value=>'"'+String(value).replaceAll('"','""')+'"').join(',')).join('\r\n');
  downloadFile('\uFEFF'+csv,'text/csv;charset=utf-8','Weekly_Report_'+selectedWeek()+'.csv');
};

$('export-backup').onclick=()=>downloadFile(JSON.stringify(S,null,2),'application/json','Restaurant_Accounts_'+iso(new Date())+'.json');
$('import-backup').onclick=()=>$('backup-file').click();
$('backup-file').onchange=async event=>{
  const input=event.target;
  const file=input.files[0];
  const persist=persistLedger;
  input.value='';
  if(!file||!persist)return;
  try{
    if(file.size>2_000_000)throw new Error();
    const data=JSON.parse(await file.text());
    if(persist!==persistLedger)return;
    if(!data||!validDate(data.week)||!data.days||typeof data.days!=='object'||Array.isArray(data.days))throw new Error();
    if(Object.entries(data.days).some(([date,record])=>!validDate(date)||!record||typeof record!=='object'||Array.isArray(record)))throw new Error();
    const replacement=normalizeLedger(data);
    if(new TextEncoder().encode(JSON.stringify(replacement)).length>250000)throw new Error();
    if(!confirm(L('Replace the entire ledger, including saved weeks, with this backup?')))return;
    S=replacement;
    showWeek(S.week);
    save();
  }catch{
    alert(L('Invalid or oversized backup file.'));
  }
};
$('clear-week').onclick=()=>{
  if(!persistLedger||!confirm(L('Clear all income and expenses for the selected week?')))return;
  if(viewWeek&&!S.savedWeeks.includes(viewWeek))S.savedWeeks.push(viewWeek);
  for(const date of dates())delete S.days[date];
  render();
  save();
};

function canvases(){
  const pages=[];
  const width=1240, height=1754, margin=72, content=width-2*margin;
  const rtl=ar();
  const color={ink:'#172c25', muted:'#50665b', green:'#0b6145', pale:'#edf5f0',
    border:'#dce8e0', stripe:'#f7faf8', white:'#ffffff', loss:'#a03535'};
  const period=weekLabel(selectedWeek());
  const title=S.name||L('Restaurant Accounts');
  const amount=value=>Number.isFinite(value)?value.toLocaleString(locale(),{
    minimumFractionDigits:2, maximumFractionDigits:2
  }):String(value);
  const rows=dates().map(date=>({date,...tot(date)}));
  const summary={i:0,e:0,ci:0,cr:0,ec:0,ek:0};
  for(const row of rows)for(const key in summary)summary[key]+=row[key];

  let ctx;
  function rect(x,y,w,h,fill){
    ctx.fillStyle=fill;
    ctx.fillRect(rtl?width-x-w:x,y,w,h);
  }
  function text(value,x,y,{size=26,bold=false,fill=color.ink,align='start',max=content}={}){
    ctx.font=(bold?'bold ':'')+size+'px Arial, sans-serif';
    ctx.fillStyle=fill;
    ctx.direction=rtl?'rtl':'ltr';
    ctx.textAlign=align;
    ctx.fillText(value,rtl?width-x:x,y,max);
  }
  function newPage(section){
    const canvas=document.createElement('canvas');
    canvas.width=width;
    canvas.height=height;
    pages.push(canvas);
    ctx=canvas.getContext('2d');
    rect(0,0,width,height,color.white);
    rect(0,0,width,228,color.green);
    text(L('Weekly report'),margin,61,{size:25,bold:true,fill:'#d4ede0'});
    text(title,margin,132,{size:53,bold:true,fill:color.white});
    text(period,margin,183,{size:30,fill:color.white});
    text(L(section),margin,311,{size:42,bold:true});
    rect(margin,339,content,2,color.border);
    rect(margin,1657,content,2,color.border);
    text(L('Restaurant Accounts'),margin,1706,{size:23,fill:color.muted,max:content*.6});
    text(L('Page')+' '+pages.length.toLocaleString(locale()),width-margin,1706,
      {align:'end',size:23,fill:color.muted});
  }

  newPage('Weekly summary');
  const cards=[
    ['TOTAL INCOME',summary.i,'Cash',summary.ci,'Credit',summary.cr],
    ['EXPENSES',summary.e,'Cash',summary.ec,'Credit',summary.ek],
    ['NET PROFIT',summary.i-summary.e,'Cash net',summary.ci-summary.ec,'Credit net',summary.cr-summary.ek]
  ];
  const gap=16, cardWidth=(content-2*gap)/3;
  cards.forEach(([label,value,first,firstValue,second,secondValue],i)=>{
    const x=margin+i*(cardWidth+gap);
    const emphasis=i===2;
    rect(x,375,cardWidth,207,emphasis?color.green:color.pale);
    const fill=emphasis?color.white:color.ink;
    const max=cardWidth-40;
    text(L(label),x+20,416,{size:24,bold:true,fill,max});
    text(amount(value),x+20,476,{size:47,bold:true,fill,max});
    text(L(first)+' · '+amount(firstValue),x+20,523,{size:21,fill,max});
    text(L(second)+' · '+amount(secondValue),x+20,554,{size:21,fill,max});
  });

  text(L('Daily details'),margin,662,{size:37,bold:true});
  text(L('Currency')+' · '+S.cur,width-margin,662,
    {size:23,align:'end',fill:color.muted,max:content/2});
  const columns=[margin+22,margin+466,margin+655,margin+847,width-margin-22];
  function dailyRow(values,y,options={}){
    values.forEach((value,index)=>text(value,columns[index],y,{
      align:index===0?'start':'end',
      max:index===0?255:161,
      fill:index===4&&options.loss?color.loss:options.fill,
      bold:options.bold
    }));
  }
  rect(margin,699,content,66,color.green);
  dailyRow(['Day','Cash','Credit','Expenses','Net'].map(L),742,{fill:color.white,bold:true});
  rows.forEach((row,i)=>{
    const y=765+i*82;
    if(i%2===0)rect(margin,y,content,82,color.stripe);
    rect(margin,y+81,content,1,color.border);
    text(dn(row.date),columns[0],y+34,{bold:true,max:255});
    text(sd(row.date),columns[0],y+62,{size:21,fill:color.muted,max:255});
    dailyRow(['',amount(row.ci),amount(row.cr),amount(row.e),amount(row.i-row.e)],
      y+51,{loss:row.i<row.e});
  });
  rect(margin,1340,content,74,color.pale);
  dailyRow([L('Total'),amount(summary.ci),amount(summary.cr),amount(summary.e),
    amount(summary.i-summary.e)],1387,{bold:true,loss:summary.i<summary.e});

  const expenses=rows.flatMap(row=>(S.days[row.date]?.exp||[])
    .filter(expense=>num(expense.a)||expense.n)
    .map(expense=>({date:row.date,...expense})));
  const detailColumns=[margin+22,margin+170,margin+460,margin+650,width-margin-22];
  const detailHeaders=['Date','Category','Payment method','Notes','Amount'].map(L);
  let y;
  function expensePage(){
    newPage('Expense details');
    rect(margin,375,content,67,color.green);
    detailHeaders.forEach((label,i)=>text(label,detailColumns[i],418,
      {size:23,bold:true,fill:color.white,align:i===4?'end':'start',max:[130,265,175,262,130][i]}));
    y=442;
  }
  function wrapNote(note){
    ctx.font='23px Arial, sans-serif';
    const lines=[];
    let line='';
    for(const word of note.trim().split(/\s+/)){
      const next=line?line+' '+word:word;
      if(line&&ctx.measureText(next).width>262){lines.push(line);line=word}
      else line=next;
    }
    lines.push(line);
    return lines;
  }
  if(expenses.length)expensePage();
  expenses.forEach((expense,i)=>{
    const note=expense.c===SALARIES&&expense.worker
      ? [expense.worker,expense.n].filter(Boolean).join(' · ')
      : expense.n;
    const lines=wrapNote(note);
    let offset=0;
    while(offset<lines.length){
      if(y+65>1615)expensePage();
      const count=Math.min(lines.length-offset,Math.floor((1615-y-24)/30));
      const rowHeight=Math.max(65,24+count*30);
      if(i%2===0)rect(margin,y,content,rowHeight,color.stripe);
      rect(margin,y+rowHeight-1,content,1,color.border);
      const lead=y+40;
      if(offset===0){
        text(sd(expense.date),detailColumns[0],lead,{size:23,max:132});
        text(L(expense.c),detailColumns[1],lead,{size:23,max:267});
        text(L(isCr(expense)?'Credit':'Cash'),detailColumns[2],lead,{size:23,max:155});
        text(amount(num(expense.a)),detailColumns[4],lead,
          {size:23,bold:true,align:'end',max:130});
      }
      lines.slice(offset,offset+count).forEach((line,j)=>text(line,detailColumns[3],lead+j*30,
        {size:23,max:262}));
      offset+=count;
      y+=rowHeight;
    }
  });
  return pages;
}
function buildPdf(){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
  const doc=new J({unit:'pt',format:'a4'});
  canvases().forEach((c,i)=>{if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,595.28,841.89)});
  return doc;
}
let D=null;
try{if(window.claude&&claude.use)claude.use('downloads').then(d=>{D=d}).catch(()=>{})}catch(e){}
function preview(){
  if($('pv'))return;
  const w=document.createElement('div');w.id='pv';w.dir=ar()?'rtl':'ltr';
  w.innerHTML='<div class="pvh"><span>'+L('Press and hold an image, then choose Share or Save')+'</span><button type="button" id="pvx">'+L('Close')+'</button></div>'+canvases().map(c=>'<img alt="'+L('Report')+'" src="'+c.toDataURL('image/jpeg',0.9)+'">').join('');
  document.body.appendChild(w);$('pvx').onclick=()=>w.remove();
}
$('pdf').onclick=async()=>{
  const b=$('pdf'),o=b.textContent,doc=buildPdf();
  const f=t=>{b.textContent=t;setTimeout(()=>{b.textContent=o},2200)};
  if(!doc){f(L('Could not create file'));return}
  const name='Weekly_Report_'+selectedWeek()+'.pdf';
  try{
    const buf=doc.output('arraybuffer');
    if(D){await D.save({filename:name,data:buf})}
    else{const u=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
    f(L('Saved'));
  }catch(e){if(e&&e.code==='declined')return;preview()}
};
$('sh').onclick=async()=>{
  const b=$('sh'),o=b.textContent,doc=buildPdf();
  const f=t=>{b.textContent=t;setTimeout(()=>{b.textContent=o},2200)};
  if(!doc){f(L('Could not create file'));return}
  const name='Weekly_Report_'+selectedWeek()+'.pdf',buf=doc.output('arraybuffer');
  try{
    const file=new File([buf],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  if(D){try{await D.save({filename:name,data:buf});f(L('Saved'));return}catch(e){if(e&&e.code==='declined')return}}
  preview();
};
render();
</script>
